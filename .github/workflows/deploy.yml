name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Autosave commits only touch data/, which the site loads through the API,
    # so they don't need a rebuild.
    paths-ignore:
      - 'data/**'
      - 'openspec/**'
      - 'scripts/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # None of these are secret; they are visible in the built site.
          VITE_GITHUB_OWNER: ${{ vars.VITE_GITHUB_OWNER || github.repository_owner }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || github.event.repository.name }}
          VITE_GITHUB_BRANCH: ${{ vars.VITE_GITHUB_BRANCH || 'main' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
